[package]
name = "softphone-sip"
description = "PJSIP adapter: implements the core's SipControl (DESIGN.md §3.1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
links = "pjproject"

[dependencies]
softphone-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[build-dependencies]
cc.workspace = true
