# SPDX-License-Identifier: GPL-2.0-or-later
name: Build

on:
  push:
    branches: [main, release, "feature/**", "fix/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    env:
      OBS_VERSION: "32.2.2"
      ARCHS: arm64 x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      # Opus, pjproject (both architectures), the Qt headers and the OBS
      # frameworks take minutes to fetch and build; they only change when
      # these scripts do.
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: macos-universal-native-${{ hashFiles('scripts/bootstrap-macos.sh', 'scripts/fetch-obs-macos.sh') }}

      - name: Build Opus and pjproject, fetch Qt headers
        run: scripts/bootstrap-macos.sh

      - name: Fetch OBS frameworks
        run: scripts/fetch-obs-macos.sh arm64 x86_64

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Media clock check
        run: cargo run --quiet -p softphone-sip --example media_clock

      - name: Package universal plugin and installer
        run: scripts/package-macos.sh

      - name: Check the package
        run: |
          lipo -archs dist/obs-softphone.plugin/Contents/MacOS/obs-softphone | grep -q 'x86_64 arm64'
          ! otool -L dist/obs-softphone.plugin/Contents/MacOS/obs-softphone | grep -E 'ssl|crypto|homebrew'
          pkgutil --payload-files dist/*.pkg | grep -q 'obs-studio/plugins/obs-softphone.plugin'

      - uses: actions/upload-artifact@v4
        with:
          name: obs-softphone-macos
          path: |
            dist/*.pkg
            dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # cl, msbuild, dumpbin and lib for the native builds.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: windows-x64-native-${{ hashFiles('scripts/bootstrap-windows.ps1') }}

      - name: Build Opus and pjproject, fetch Qt and OBS libraries
        run: scripts/bootstrap-windows.ps1

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Media clock check
        run: cargo run --quiet -p softphone-sip --example media_clock

      - name: Package plugin and installer
        run: scripts/package-windows.ps1

      - name: Check the package
        run: |
          $deps = dumpbin /nologo /dependents dist\obs-softphone\bin\64bit\obs-softphone.dll
          $deps
          # Only OBS, Qt and Windows/VC runtime DLLs: everything else is static.
          $unexpected = $deps | Where-Object { $_ -match '^\s+\S+\.dll$' } |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -notmatch '^(obs|obs-frontend-api|Qt6(Core|Gui|Widgets)|vcruntime140(_1)?|msvcp140|api-ms-win-.*|KERNEL32|USER32|ADVAPI32|WS2_32|IPHLPAPI|WINMM|ole32|OLEAUT32|CRYPT32|Secur32|ncrypt|bcrypt|bcryptprimitives|ntdll|SHELL32|dbghelp)\.dll$' }
          if ($unexpected) { throw "unexpected DLL dependencies: $unexpected" }
          if (-not (Test-Path dist\*-installer.exe)) { throw 'installer missing' }

      - uses: actions/upload-artifact@v4
        with:
          name: obs-softphone-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # On a version tag: collect the installers into a draft GitHub Release,
  # to be reviewed and published by hand.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
